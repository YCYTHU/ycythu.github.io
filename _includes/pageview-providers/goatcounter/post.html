{%- assign _GOATCOUNTER_ENDPOINT = site.pageview.goatcounter.endpoint | default: '' -%}
{%- assign _GOATCOUNTER_BASE = _GOATCOUNTER_ENDPOINT | replace: '/count', '' -%}

{%- if site.pageview.provider == 'goatcounter' and _GOATCOUNTER_ENDPOINT != '' -%}
  <script
    data-goatcounter="{{ _GOATCOUNTER_ENDPOINT | escape }}"
    async
    src="https://gc.zgo.at/count.js"></script>
  <script>
    {%- include pageview-providers/goatcounter/goatcounter.js endpoint=_GOATCOUNTER_BASE -%}
    window.pageview.getAll('.js-pageview');
  </script>
{%- endif -%}
